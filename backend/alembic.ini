# Alembic configuration for NITSU Health backend.
# The database URL is read from the application settings (app.core.config),
# not hard-coded here, so the same config works for dev (SQLite) and
# production (PostgreSQL).

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally not set here; env.py reads it from settings.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
